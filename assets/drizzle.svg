<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Drizzle the rain cloud waters five growing flowers">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#3b5b8c"/>
    </linearGradient>
    <g id="stem">
      <path d="M0 0 C-2 -14 2 -24 0 -36" stroke="#4caf6a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="-9" cy="-20" rx="9" ry="4.5" fill="#5fcf80" transform="rotate(-30 -9 -20)"/>
      <ellipse cx="9" cy="-27" rx="9" ry="4.5" fill="#5fcf80" transform="rotate(30 9 -27)"/>
    </g>
    <path id="drop" d="M0 -6 Q4 1 0 5 Q-4 1 0 -6 Z"/>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#dusk)"/>

  <!-- ground -->
  <path d="M0 236 C120 228 240 242 360 236 C480 230 600 242 720 236 C800 232 860 238 900 234 L900 280 L0 280 Z" fill="#1f3b2f"/>

  <!-- rain -->
  <g fill="#7fd0ff">
    <g transform="translate(380 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" repeatCount="indefinite"/></use></g>
    <g transform="translate(415 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.3s" repeatCount="indefinite"/></use></g>
    <g transform="translate(450 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.6s" repeatCount="indefinite"/></use></g>
    <g transform="translate(485 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.15s" repeatCount="indefinite"/></use></g>
    <g transform="translate(520 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.45s" repeatCount="indefinite"/></use></g>
    <g transform="translate(398 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.8s" repeatCount="indefinite"/></use></g>
    <g transform="translate(468 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.9s" repeatCount="indefinite"/></use></g>
    <g transform="translate(503 96)"><use href="#drop"><animateTransform attributeName="transform" type="translate" values="0 0;0 135" dur="1.1s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" begin="0.7s" repeatCount="indefinite"/></use></g>
  </g>

  <!-- flowers -->
  <g transform="translate(340 240)"><g>
    <animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    <use href="#stem"/><circle cx="0" cy="-40" r="7" fill="#ffb3c7"/><circle cx="0" cy="-40" r="3" fill="#ffd166"/>
  </g></g>
  <g transform="translate(395 242)"><g>
    <animateTransform attributeName="transform" type="scale" values="0.3;1.4;0.3" keyTimes="0;0.5;1" dur="8s" begin="0.5s" repeatCount="indefinite"/>
    <use href="#stem"/><circle cx="0" cy="-40" r="7" fill="#c3a6ff"/><circle cx="0" cy="-40" r="3" fill="#ffd166"/>
  </g></g>
  <g transform="translate(450 242)"><g>
    <animateTransform attributeName="transform" type="scale" values="0.3;1.6;0.3" keyTimes="0;0.5;1" dur="8s" begin="1s" repeatCount="indefinite"/>
    <use href="#stem"/><circle cx="0" cy="-40" r="7" fill="#ffd166"/><circle cx="0" cy="-40" r="3" fill="#ff8a5b"/>
  </g></g>
  <g transform="translate(505 242)"><g>
    <animateTransform attributeName="transform" type="scale" values="0.3;1.4;0.3" keyTimes="0;0.5;1" dur="8s" begin="1.5s" repeatCount="indefinite"/>
    <use href="#stem"/><circle cx="0" cy="-40" r="7" fill="#ff9fb2"/><circle cx="0" cy="-40" r="3" fill="#ffd166"/>
  </g></g>
  <g transform="translate(560 240)"><g>
    <animateTransform attributeName="transform" type="scale" values="0.3;1.2;0.3" keyTimes="0;0.5;1" dur="8s" begin="2s" repeatCount="indefinite"/>
    <use href="#stem"/><circle cx="0" cy="-40" r="7" fill="#7fd0ff"/><circle cx="0" cy="-40" r="3" fill="#ffd166"/>
  </g></g>

  <!-- Drizzle the cloud -->
  <g transform="translate(450 56)">
    <animateTransform attributeName="transform" type="translate" values="450 56;450 48;450 56" dur="3s" repeatCount="indefinite"/>
    <g fill="#dfe9f5" stroke="#b7c6dc" stroke-width="2">
      <circle cx="-44" cy="6" r="28"/>
      <circle cx="-10" cy="-10" r="36"/>
      <circle cx="30" cy="-2" r="32"/>
      <circle cx="58" cy="10" r="22"/>
      <rect x="-72" y="6" width="152" height="32" rx="16"/>
    </g>
    <g fill="#dfe9f5">
      <circle cx="-44" cy="6" r="26"/>
      <circle cx="-10" cy="-10" r="34"/>
      <circle cx="30" cy="-2" r="30"/>
      <circle cx="58" cy="10" r="20"/>
      <rect x="-70" y="8" width="148" height="28" rx="14"/>
    </g>
    <ellipse cx="-16" cy="12" rx="4.5" ry="5" fill="#35405a"><animate attributeName="ry" values="5;5;0.6;5" keyTimes="0;0.88;0.93;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="22" cy="12" rx="4.5" ry="5" fill="#35405a"><animate attributeName="ry" values="5;5;0.6;5" keyTimes="0;0.88;0.93;1" dur="3.5s" repeatCount="indefinite"/></ellipse>
    <circle cx="-30" cy="22" r="5" fill="#ffb3c7" fill-opacity="0.7"/>
    <circle cx="36" cy="22" r="5" fill="#ffb3c7" fill-opacity="0.7"/>
    <path d="M-4 24 Q3 31 10 24" stroke="#35405a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <text x="450" y="268" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#b9c8e6">Drizzle the rain cloud, on a very reliable schedule</text>
</svg>
