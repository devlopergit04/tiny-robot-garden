<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Character sheet: Bolt the robot, Pip the snail, Glim the firefly">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="#12172e"/>
  <line x1="300" y1="30" x2="300" y2="250" stroke="#262d52" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="600" y1="30" x2="600" y2="250" stroke="#262d52" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="30" y="226" width="240" height="4" rx="2" fill="#1f3b2f"/>
  <rect x="330" y="226" width="240" height="4" rx="2" fill="#1f3b2f"/>

  <!-- ============ Bolt ============ -->
  <g transform="translate(150 226) scale(0.85)">
    <rect x="-24" y="-22" width="14" height="22" rx="4" fill="#4a5a6a"/>
    <rect x="10" y="-22" width="14" height="22" rx="4" fill="#4a5a6a"/>
    <rect x="-28" y="-6" width="22" height="8" rx="4" fill="#2b3a4a"/>
    <rect x="6" y="-6" width="22" height="8" rx="4" fill="#2b3a4a"/>

    <rect x="36" y="-86" width="10" height="38" rx="5" fill="#6f9cc6" stroke="#2b3a4a" stroke-width="2"/>

    <!-- waving arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 -41 -86;-150 -41 -86;-110 -41 -86;-150 -41 -86;0 -41 -86" keyTimes="0;0.2;0.5;0.8;1" dur="3.5s" repeatCount="indefinite"/>
      <rect x="-46" y="-86" width="10" height="38" rx="5" fill="#6f9cc6" stroke="#2b3a4a" stroke-width="2"/>
    </g>

    <rect x="-34" y="-92" width="68" height="72" rx="12" fill="#8fb8de" stroke="#2b3a4a" stroke-width="3"/>
    <rect x="-20" y="-76" width="40" height="24" rx="6" fill="#2b3a4a"/>
    <circle cx="-10" cy="-64" r="3.5" fill="#7cffb2"><animate attributeName="fill" values="#7cffb2;#2b3a4a;#7cffb2" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="-64" r="3.5" fill="#ffd166"><animate attributeName="fill" values="#2b3a4a;#ffd166;#2b3a4a" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="-64" r="3.5" fill="#ff6b6b"><animate attributeName="fill" values="#ff6b6b;#2b3a4a;#ff6b6b" dur="1.7s" repeatCount="indefinite"/></circle>
    <rect x="-14" y="-44" width="28" height="6" rx="3" fill="#6f9cc6"/>

    <!-- head tilts -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 0 -96;4 0 -96;-4 0 -96" dur="3s" repeatCount="indefinite"/>
      <rect x="-8" y="-98" width="16" height="8" fill="#4a5a6a"/>
      <rect x="-32" y="-142" width="64" height="46" rx="14" fill="#a9cdea" stroke="#2b3a4a" stroke-width="3"/>
      <rect x="-25" y="-134" width="50" height="30" rx="9" fill="#16202c"/>
      <ellipse cx="-12" cy="-120" rx="6" ry="6" fill="#7cffb2"><animate attributeName="ry" values="6;6;0.8;6" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="12" cy="-120" rx="6" ry="6" fill="#7cffb2"><animate attributeName="ry" values="6;6;0.8;6" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <path d="M-8 -110 Q0 -102 8 -110" stroke="#7cffb2" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="0" y1="-142" x2="0" y2="-158" stroke="#2b3a4a" stroke-width="3"/>
      <circle cx="0" cy="-162" r="5" fill="#ffd166"><animate attributeName="fill" values="#ffd166;#ff6b6b;#ffd166" dur="1.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="150" y="268" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8ecff">Bolt</text>
  <text x="150" y="286" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8f9bd6">gardener, optimist</text>

  <!-- ============ Pip ============ -->
  <g transform="translate(450 226)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-26 0;26 0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="6s" repeatCount="indefinite"/>

      <!-- body -->
      <path d="M-46 0 C-46 -10 -30 -14 -10 -14 L30 -14 C44 -14 52 -22 52 -34 C52 -42 58 -44 60 -38 C64 -22 62 -4 46 0 Z" fill="#c9d98b" stroke="#6e8a2f" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- eye stalks -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 56 -36;8 56 -36;-6 56 -36" dur="1.8s" repeatCount="indefinite"/>
        <line x1="56" y1="-36" x2="52" y2="-58" stroke="#6e8a2f" stroke-width="3" stroke-linecap="round"/>
        <circle cx="52" cy="-61" r="5" fill="#fff" stroke="#6e8a2f" stroke-width="1.5"/>
        <circle cx="53" cy="-61" r="2" fill="#16202c"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="8 60 -36;-6 60 -36;8 60 -36" dur="2.1s" repeatCount="indefinite"/>
        <line x1="60" y1="-36" x2="68" y2="-56" stroke="#6e8a2f" stroke-width="3" stroke-linecap="round"/>
        <circle cx="69" cy="-59" r="5" fill="#fff" stroke="#6e8a2f" stroke-width="1.5"/>
        <circle cx="70" cy="-59" r="2" fill="#16202c"/>
      </g>
      <path d="M56 -22 Q62 -18 66 -23" stroke="#6e8a2f" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- shell, gently bobbing -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="1s" repeatCount="indefinite"/>
        <circle cx="-6" cy="-38" r="32" fill="#e9a23b" stroke="#a8620f" stroke-width="3"/>
        <path d="M-6 -38 m0 0 a5 5 0 1 1 5 5 a11 11 0 1 1 -11 -11 a17 17 0 1 1 17 17 a23 23 0 1 1 -23 -23" fill="none" stroke="#a8620f" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <text x="450" y="268" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8ecff">Pip</text>
  <text x="450" y="286" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8f9bd6">slow, but never late</text>

  <!-- ============ Glim ============ -->
  <g transform="translate(750 130)">
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" path="M-45 0 C-45 -45 45 -45 45 0 C45 45 -45 45 -45 0 Z"/>

      <!-- glow -->
      <circle cx="0" cy="12" r="30" fill="url(#halo)">
        <animate attributeName="r" values="22;34;22" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- wings -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-28 -3 -6;8 -3 -6;-28 -3 -6" dur="0.25s" repeatCount="indefinite"/>
        <ellipse cx="-12" cy="-14" rx="6" ry="14" fill="#cfe9ff" fill-opacity="0.75" transform="rotate(-25 -12 -14)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="28 3 -6;-8 3 -6;28 3 -6" dur="0.25s" repeatCount="indefinite"/>
        <ellipse cx="12" cy="-14" rx="6" ry="14" fill="#cfe9ff" fill-opacity="0.75" transform="rotate(25 12 -14)"/>
      </g>

      <!-- body -->
      <ellipse cx="0" cy="-2" rx="9" ry="11" fill="#3d3d4e" stroke="#1b1b28" stroke-width="2"/>
      <ellipse cx="0" cy="14" rx="9" ry="12" fill="#ffe66d">
        <animate attributeName="fill" values="#ffe66d;#fff6a8;#ffe66d" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-3.5" cy="-4" r="2" fill="#fff"/>
      <circle cx="3.5" cy="-4" r="2" fill="#fff"/>
      <circle cx="-3.5" cy="-4" r="0.9" fill="#16202c"/>
      <circle cx="3.5" cy="-4" r="0.9" fill="#16202c"/>
      <path d="M-3 2 Q0 5 3 2" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M-3 -12 Q-8 -20 -12 -20" stroke="#3d3d4e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M3 -12 Q8 -20 12 -20" stroke="#3d3d4e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <text x="750" y="268" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e8ecff">Glim</text>
  <text x="750" y="286" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8f9bd6">night shift lantern</text>
</svg>
